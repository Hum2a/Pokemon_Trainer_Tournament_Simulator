[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-trainer-tournament-simulator"
version = "1.0.0"
description = "Large-scale Pokémon Showdown simulations: trainer vs trainer, Pokémon vs leaders, 1v1 matchup matrices"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "cRz-Shadows"}
]
keywords = ["pokemon", "simulator", "showdown", "battle", "tournament"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/cRz-Shadows/Pokemon_Trainer_Tournament_Simulator"
Repository = "https://github.com/cRz-Shadows/Pokemon_Trainer_Tournament_Simulator"
Documentation = "https://github.com/cRz-Shadows/Pokemon_Trainer_Tournament_Simulator#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
