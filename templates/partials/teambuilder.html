<section class="panel teambuilder-panel">
  <h2 class="panel-title" data-toggle="teambuilder">
    <span>Team Builder</span>
    <span class="toggle">▼</span>
  </h2>
  <div class="panel-content" id="teambuilderContent">
    <p class="editor-hint">Build Pokemon in Showdown format. Filter by type, region, or role. Import popular Smogon sets.</p>
    <div class="builder-filters">
      <label>
        <span>Type</span>
        <select id="builderFilterType">
          <option value="">All types</option>
          <option value="Normal">Normal</option>
          <option value="Fire">Fire</option>
          <option value="Water">Water</option>
          <option value="Electric">Electric</option>
          <option value="Grass">Grass</option>
          <option value="Ice">Ice</option>
          <option value="Fighting">Fighting</option>
          <option value="Poison">Poison</option>
          <option value="Ground">Ground</option>
          <option value="Flying">Flying</option>
          <option value="Psychic">Psychic</option>
          <option value="Bug">Bug</option>
          <option value="Rock">Rock</option>
          <option value="Ghost">Ghost</option>
          <option value="Dragon">Dragon</option>
          <option value="Dark">Dark</option>
          <option value="Steel">Steel</option>
          <option value="Fairy">Fairy</option>
        </select>
      </label>
      <label>
        <span>Region</span>
        <select id="builderFilterRegion">
          <option value="">All regions</option>
          <option value="Kanto">Kanto</option>
          <option value="Johto">Johto</option>
          <option value="Hoenn">Hoenn</option>
          <option value="Sinnoh">Sinnoh</option>
          <option value="Unova">Unova</option>
          <option value="Kalos">Kalos</option>
          <option value="Alola">Alola</option>
          <option value="Galar">Galar</option>
          <option value="Paldea">Paldea</option>
          <option value="Other">Other</option>
        </select>
      </label>
      <label>
        <span>Role</span>
        <select id="builderFilterRole">
          <option value="">All roles</option>
          <option value="Physical Attacker">Physical Attacker</option>
          <option value="Special Attacker">Special Attacker</option>
          <option value="Wall">Wall</option>
          <option value="Mixed">Mixed</option>
          <option value="Balanced">Balanced</option>
        </select>
      </label>
    </div>
    <div class="builder-form">
      <div class="builder-row">
        <label>
          <span>Pokemon</span>
          <input type="text" id="builderSpecies" placeholder="Search species (e.g. Pikachu)">
          <div id="builderSpeciesList" class="dropdown-list"></div>
        </label>
        <label>
          <span>Level</span>
          <div class="builder-level-row">
            <input type="number" id="builderLevel" value="50" min="1" max="100">
            <button type="button" class="btn btn-secondary btn-level" data-level="50">50</button>
            <button type="button" class="btn btn-secondary btn-level" data-level="100">100</button>
          </div>
        </label>
      </div>
      <div id="builderStats" class="builder-stats" aria-label="Base stats">
        <span class="stat" data-stat="hp">HP —</span>
        <span class="stat" data-stat="atk">Atk —</span>
        <span class="stat" data-stat="def">Def —</span>
        <span class="stat" data-stat="spa">SpA —</span>
        <span class="stat" data-stat="spd">SpD —</span>
        <span class="stat" data-stat="spe">Spe —</span>
      </div>
      <div class="builder-row smogon-row">
        <label>
          <span>Smogon Sets</span>
          <select id="builderSmogonFormat">
            <option value="gen9ou">Gen 9 OU</option>
            <option value="gen9uu">Gen 9 UU</option>
            <option value="gen9ru">Gen 9 RU</option>
            <option value="gen9nu">Gen 9 NU</option>
            <option value="gen9">All Gen 9</option>
          </select>
        </label>
        <div id="builderSmogonSets" class="smogon-sets-list"></div>
      </div>
      <div class="builder-row">
        <label>
          <span>Ability</span>
          <select id="builderAbility"></select>
        </label>
        <label>
          <span>Item</span>
          <select id="builderItem"></select>
        </label>
        <label>
          <span>Nature</span>
          <select id="builderNature"></select>
        </label>
      </div>
      <div class="builder-row">
        <label>
          <span>Move 1</span>
          <select id="builderMove1"></select>
        </label>
        <label>
          <span>Move 2</span>
          <select id="builderMove2"></select>
        </label>
        <label>
          <span>Move 3</span>
          <select id="builderMove3"></select>
        </label>
        <label>
          <span>Move 4</span>
          <select id="builderMove4"></select>
        </label>
      </div>
      <div class="builder-row builder-actions">
        <button type="button" class="btn btn-accent" id="builderAdd">Add to Team</button>
        <button type="button" class="btn btn-primary" id="builderExport">Export to Editor</button>
      </div>
    </div>
    <div class="builder-team">
      <h4>Current Team</h4>
      <div id="builderTeamList"></div>
    </div>
  </div>
</section>
