<section class="panel settings-panel">
  <h2 class="panel-title" data-toggle="settings">
    <span>Settings</span>
    <span class="toggle">▼</span>
  </h2>
  <div class="panel-content" id="settingsContent">
    <div class="settings-grid">
      <fieldset class="settings-group">
        <legend>Trainer Tournament</legend>
        <label>
          <span>Threads</span>
          <input type="number" id="trainerThreads" min="1" max="64" value="4">
        </label>
        <label>
          <span>Level Override</span>
          <input type="number" id="trainerLevel" min="1" max="100" placeholder="50 (or empty for build levels)">
        </label>
        <label>
          <span>Battles per Matchup</span>
          <input type="number" id="runNTimes" min="1" value="100">
        </label>
        <label>
          <span>Battle Cap (test)</span>
          <input type="number" id="trainerN" min="1" placeholder="Empty = all">
        </label>
        <label class="checkbox">
          <input type="checkbox" id="randomiseTeams">
          <span>Randomise Teams</span>
        </label>
        <label>
          <span>Pokemon File</span>
          <input type="text" id="trainerFilename" value="Inputs/GymLeaderPokemon.txt">
        </label>
      </fieldset>
      <fieldset class="settings-group">
        <legend>Pokemon Tournament</legend>
        <label>
          <span>Threads</span>
          <input type="number" id="pokemonThreads" min="1" max="64" value="4">
        </label>
        <label>
          <span>Battle Cap</span>
          <input type="number" id="pokemonN" min="1" placeholder="2000">
        </label>
      </fieldset>
      <fieldset class="settings-group">
        <legend>Parse Output</legend>
        <label>
          <span>Output File</span>
          <input type="text" id="outputFile" value="output.txt">
        </label>
      </fieldset>
    </div>
    <button type="button" class="btn btn-secondary" id="saveSettings">Save Settings</button>
  </div>
</section>
