<section class="panel actions-panel">
  <h2 class="panel-title">Actions</h2>
  <div class="actions-grid">
    <div class="action-group">
      <h3>Build Phase</h3>
      <button type="button" class="btn btn-primary" id="buildTrainer">Build Trainer Battles</button>
      <button type="button" class="btn btn-primary" id="buildPokemon">Build Pokemon vs Leaders</button>
    </div>
    <div class="action-group">
      <h3>Run Phase</h3>
      <button type="button" class="btn btn-accent" id="runTrainer">Run Trainer Simulations</button>
      <button type="button" class="btn btn-accent" id="runPokemon">Run Pokemon Simulations</button>
    </div>
    <div class="action-group">
      <h3>Parse Phase</h3>
      <button type="button" class="btn btn-primary" id="parsePng">Parse to PNG Matrix</button>
      <button type="button" class="btn btn-primary" id="parseCsv">Parse to CSV</button>
    </div>
  </div>
</section>
