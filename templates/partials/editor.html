<section class="panel editor-panel">
  <h2 class="panel-title" data-toggle="editor">
    <span>Pokemon Builds Editor</span>
    <span class="toggle">▼</span>
  </h2>
  <div class="panel-content" id="editorContent">
    <p class="editor-hint">Edit GymLeaderPokemon.txt (Showdown format: <code>|Species</code> per build, Level, Nature, Ability, moves) or GymLeaderTeams.json (trainer → [[species, lineNo], ...]).</p>
    <div class="editor-toolbar">
      <label>
        <span>File</span>
        <select id="editorFileSelect">
          <option value="Inputs/GymLeaderPokemon.txt">Inputs/GymLeaderPokemon.txt</option>
          <option value="Inputs/GymLeaderTeams.json">Inputs/GymLeaderTeams.json</option>
        </select>
      </label>
      <button type="button" class="btn btn-primary" id="loadFile">Load</button>
      <button type="button" class="btn btn-accent" id="saveFile">Save</button>
      <button type="button" class="btn btn-small" id="loadExample" title="Load from example (Trainer Tournament 1+2)">Load example</button>
    </div>
    <textarea id="fileEditor" placeholder="Load a file to edit..."></textarea>
  </div>
</section>
