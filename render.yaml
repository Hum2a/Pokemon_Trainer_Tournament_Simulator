# Render Blueprint - Pokemon Battle Simulator (split deployment)
# Backend: Native Python. Frontend: deploy separately to Netlify/Vercel/Cloudflare Pages.
#
# Required env vars (add in Render dashboard):
#   SUPABASE_URL, SUPABASE_JWT_SECRET, SUPABASE_SECRET_KEY
#   CORS_ORIGINS = https://your-frontend.netlify.app (comma-separated for multiple)

services:
  - type: web
    name: pokemon-simulator-api
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300 app:app
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: API_ONLY
        value: "1"
