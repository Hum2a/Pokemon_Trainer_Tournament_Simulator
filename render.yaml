# Render Blueprint - Pokemon Battle Simulator
# Deploy: Connect repo at dashboard.render.com, or use "New > Blueprint"
# Docs: https://render.com/docs/infrastructure-as-code
#
# Required env vars (add in Render dashboard):
#   SUPABASE_URL, SUPABASE_JWT_SECRET, SUPABASE_SECRET_KEY
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY (for frontend build)

services:
  - type: web
    name: pokemon-simulator
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
